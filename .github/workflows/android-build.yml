name: Build Android APK

on:
  pull_request:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1' 'build-tools;28.0.3' 'platforms;android-28'

      - name: Copy debug keystore
        run: cp Projects/Deployment/Travis/helio.debug.jks "$HOME/helio.keystore"

      - name: Build APK
        working-directory: Projects/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helio-android-apk
          path: Projects/Android/app/build/outputs/apk/**/*.apk
